[project]
name = "docqa-assistant"
version = "0.1.0"
description = "PDF question answering with span-level citations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastembed>=0.9.0",
    "pgvector>=0.5.1",
    "pydantic>=2.14.1",
    "pymupdf==2.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
docqa = "docqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docqa"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
"scripts/*" = ["D"]
"alembic/*" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"
plugins = []

[[tool.mypy.overrides]]
module = ["fastembed.*", "tokenizers.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
