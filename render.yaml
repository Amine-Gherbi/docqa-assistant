# Reproducible description of the hosted pair. The services were created through
# the Render API; this file documents the same configuration for a rebuild.
#
# Secrets are deliberately `sync: false`: Render prompts for them and never
# reads them from this repository.
#
# The free plan runs no pre-deploy command, so `alembic upgrade head` and the
# corpus check are an operator step from a machine that holds the database URL
# (see docs/ENV.md). `GET /ready` reports the database counts and the applied
# migration, so a deploy whose database lacks the corpus fails readiness.
services:
  - type: web
    name: marginalia-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: w2-b-hosting
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    # Render injects PORT; the image binds ${PORT:-8788}. Do not set it here.
    envVars:
      - key: DOCQA_DATABASE_URL
        sync: false
      # Signs the opaque visitor cookie; set once so sessions survive a deploy.
      - key: DOCQA_COOKIE_SECRET
        sync: false
      # The UI is another origin over HTTPS: the cookie is Secure + SameSite=None.
      - key: DOCQA_COOKIE_SECURE
        value: "1"
      - key: DOCQA_MODEL_API_KEY
        sync: false
      - key: DOCQA_MODEL_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: DOCQA_MODEL_NAME
        value: gemini-flash-lite-latest
      - key: DOCQA_MODEL_FALLBACK_NAMES
        value: gemini-3.8-flash
      - key: DOCQA_CORS_ORIGINS
        value: https://marginalia-ui.onrender.com
      - key: DOCQA_EMBEDDER
        value: fastembed
      - key: DOCQA_RERANKER
        value: fastembed
      - key: DOCQA_STRUCTURED_OUTPUT
        value: tool
      # 512 MB free instance: one ONNX thread, one rerank pair at a time, and
      # no CPU memory arena. See docs/ENV.md and the OOM measurement in
      # docs/PROOF.md.
      - key: DOCQA_ONNX_THREADS
        value: "1"
      - key: DOCQA_RERANK_BATCH_SIZE
        value: "1"
      - key: DOCQA_ONNX_MEMORY_ARENA
        value: "0"
      # Two concurrent cross-encoder calls pushed the process over 512 MB.
      - key: DOCQA_ONNX_CONCURRENCY
        value: "1"

  - type: web
    name: marginalia-ui
    runtime: static
    branch: w2-b-hosting
    buildCommand: cd ui && npm ci && npm run build
    staticPublishPath: ui/dist
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE
        value: https://marginalia-api-4pvl.onrender.com/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
